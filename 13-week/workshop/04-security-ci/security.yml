name: Week 13 security gates

on:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Maven and npm dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: code-corhuila/market-agri-docs
          ref: main
          path: market-agri-docs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: market-agri-docs/12-ux-ui/MVP/marketplace-agricultural-huila-monolith/backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Maven
        run: sudo apt-get update && sudo apt-get install -y maven
      - name: Audit Maven dependencies
        working-directory: market-agri-docs/12-ux-ui/MVP/marketplace-agricultural-huila-monolith/backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            mvn -B -DskipTests org.owasp:dependency-check-maven:13.0.0:check -DfailBuildOnCVSS=7 -DnvdApiKey="$NVD_API_KEY"
          else
            mvn -B -DskipTests org.owasp:dependency-check-maven:13.0.0:check -DfailBuildOnCVSS=7
          fi
      - name: Audit frontend lockfile dependencies
        working-directory: market-agri-docs/12-ux-ui/MVP/marketplace-agricultural-huila-monolith/frontend
        run: npm audit --audit-level=high

  authorization-regression:
    name: Buyer cannot call producer-only endpoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: code-corhuila/market-agri-docs
          ref: main
          path: market-agri-docs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: market-agri-docs/12-ux-ui/MVP/marketplace-agricultural-huila-monolith/backend/pom.xml
      - name: Install Maven
        run: sudo apt-get update && sudo apt-get install -y maven
      - name: Run the maintained negative authorization test in an isolated project copy
        shell: pwsh
        run: >-
          ./13-week/workshop/04-security-ci/Prepare-AuthzTestCopy.ps1
          -BackendPath ./market-agri-docs/12-ux-ui/MVP/marketplace-agricultural-huila-monolith/backend
